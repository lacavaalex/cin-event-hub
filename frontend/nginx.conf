# Config do Nginx para servir o SPA (React + react-router-dom).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Arquivos com hash no nome (ex.: assets/index-a1b2c3.js) podem ser
    # cacheados "para sempre" pelo navegador: se o conteúdo mudar, o nome
    # do arquivo muda junto (o Vite já faz isso no build).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # A chave do SPA: qualquer caminho que não bata com um arquivo real
    # (ex.: /eventos/5, /favoritos) cai de volta no index.html, e é o
    # react-router-dom (rodando no navegador) quem decide o que mostrar.
    # Sem isso, dar F5 em qualquer rota que não seja "/" devolveria 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
